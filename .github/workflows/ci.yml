name: CI
on:
  push:
    branches: [ "v4-dev" ]
  pull_request:
    branches: [ "v4-dev" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v3
        with:
          node-version: 22
      - name: Verify Change Logs
        run: node common/scripts/install-run-rush.js change --verify --target-branch origin/v4-dev
      - name: Rush Install
        run: node common/scripts/install-run-rush.js install
      - name: Verify registry portability
        run: node --test common/tests/pnpmfile.test.cjs
      - name: Rush rebuild
        run: node common/scripts/install-run-rush.js rebuild
